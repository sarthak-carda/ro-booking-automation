<!doctype html>
<html>
<head><meta charset="utf-8"><title>Example Vendor Checkout (unrepairable, offline fixture)</title></head>
<body>
  <h1>Book your tour</h1>
  <!-- Deliberately UNLIKE checkout-broken.html: the first-name field is entirely REMOVED
       (no id/name/label survives anywhere on the page), not relocated -- there is no stable
       anchor (label text, name attribute) a drift-check could possibly reason from, and the
       offline mock's "broad repair" path just regenerates the same script from the same
       funnel recording regardless of context, so it can never produce a working script
       against this page either. Used to prove Stage 2.5's repair loop still fails loudly
       (exhausts its cap, never ships) when a failure genuinely isn't fixable, preserving the
       audit gate's "never silently ship a broken script" guarantee. -->
  <form id="checkout-form" onsubmit="return false;">
    <label>Last name <input id="last-name" name="lastName" type="text" /></label><br/>
    <label>Email <input id="email" name="email" type="email" /></label><br/>
    <label>Tour date <input id="tour-date" name="tourDate" type="text" /></label><br/>
    <label>Pax count <input id="pax-count" name="paxCount" type="number" /></label><br/>
    <button id="continue-btn" type="button" onclick="document.getElementById('payment-section').hidden = false;">
      Continue to payment
    </button>
  </form>
  <section id="payment-section" hidden>
    <h2>Payment</h2>
    <p>This offline fixture stops here on purpose — a real generated script must never fill or submit this section.</p>
  </section>
</body>
</html>
